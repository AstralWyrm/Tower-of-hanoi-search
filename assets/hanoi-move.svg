<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><rect width="1000" height="520" fill="#f8fafc"/><text x="35" y="42" font-family="Arial, sans-serif" font-size="28" fill="#172554">Tower of Hanoi: one legal move</text><text x="45" y="88" font-family="Arial, sans-serif" font-size="20" fill="#172554">Before: all disks on peg 1</text><text x="545" y="88" font-family="Arial, sans-serif" font-size="20" fill="#172554">After: move disk 1 to peg 3</text><rect x="101" y="140" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="50" y="265" width="110" height="8" rx="8" fill="#64748b"/><text x="99" y="300" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><rect x="58.0" y="240" width="94" height="22" rx="8" fill="#f59e0b"/><text x="100" y="257" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">3</text><rect x="69.0" y="215" width="72" height="22" rx="8" fill="#818cf8"/><text x="100" y="232" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">2</text><rect x="80.0" y="190" width="50" height="22" rx="8" fill="#38bdf8"/><text x="100" y="207" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">1</text><rect x="231" y="140" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="180" y="265" width="110" height="8" rx="8" fill="#64748b"/><text x="229" y="300" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><rect x="361" y="140" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="310" y="265" width="110" height="8" rx="8" fill="#64748b"/><text x="359" y="300" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><rect x="601" y="140" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="550" y="265" width="110" height="8" rx="8" fill="#64748b"/><text x="599" y="300" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><rect x="558.0" y="240" width="94" height="22" rx="8" fill="#f59e0b"/><text x="600" y="257" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">3</text><rect x="569.0" y="215" width="72" height="22" rx="8" fill="#818cf8"/><text x="600" y="232" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">2</text><rect x="731" y="140" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="680" y="265" width="110" height="8" rx="8" fill="#64748b"/><text x="729" y="300" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><rect x="861" y="140" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="810" y="265" width="110" height="8" rx="8" fill="#64748b"/><text x="859" y="300" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><rect x="840.0" y="240" width="50" height="22" rx="8" fill="#38bdf8"/><text x="860" y="257" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">1</text><text x="425" y="200" font-family="Arial, sans-serif" font-size="25" fill="#172554">1:1→3</text><text x="440" y="235" font-family="Arial, sans-serif" font-size="38" fill="#172554">→</text><text x="45" y="365" font-family="Arial, sans-serif" font-size="23" fill="#172554">Move only the top disk. Never place a larger disk on a smaller disk.</text><text x="45" y="410" font-family="Arial, sans-serif" font-size="20" fill="#172554">Disk 1 is smallest. Peg numbers start at 1.</text><text x="45" y="460" font-family="Arial, sans-serif" font-size="22" fill="#172554">Start: [[1, 2, 3], [], []]     Goal: [[], [], [1, 2, 3]]</text></svg>