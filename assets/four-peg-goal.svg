 fill="#64748b"/><text x="569" y="305" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><rect x="701" y="145" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="650" y="270" width="110" height="8" rx="8" fill="#64748b"/><text x="699" y="305" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><rect x="669.0" y="245" width="72" height="22" rx="8" fill="#818cf8"/><text x="700" y="262" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">2</text><rect x="680.0" y="220" width="50" height="22" rx="8" fill="#38bdf8"/><text x="700" y="237" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">1</text><rect x="831" y="145" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="780" y="270" width="110" height="8" rx="8" fill="#64748b"/><text x="829" y="305" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><rect x="788.0" y="245" width="94" height="22" rx="8" fill="#f59e0b"/><text x="830" y="262" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">3</text><rect x="926" y="145" width="8" height="125" rx="8" fill="#94a3b8"/><rect x="875" y="270" width="110" height="8" rx="8" fill="#64748b"/><text x="924" y="305" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><text x="470" y="190" font-family="Arial, sans-serif" font-size="38" fill="#172554">→</text><text x="40" y="355" font-family="Arial, sans-serif" font-size="22" fill="#172554">Both end pegs are empty; smaller disks occupy the two middle pegs.</text><text x="40" y="400" font-family="Arial, sans-serif" font-size="22" fill="#172554">For 3 disks: k(3) = 4 moves. This is not the standard final goal.</text><text x="40" y="455" font-family="Arial, sans-serif" font-size="21" fill="#172554">Full puzzle: clear smaller disks → move largest → rebuild on final peg</text></svg>