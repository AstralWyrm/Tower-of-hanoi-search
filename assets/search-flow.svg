<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><rect width="1000" height="520" fill="#f8fafc"/><text x="35" y="45" font-family="Arial, sans-serif" font-size="28" fill="#172554">IDS and IDA*: how the search limit changes</text><rect x="35" y="80" width="445" height="365" rx="8" fill="#e0f2fe"/><text x="55" y="117" font-family="Arial, sans-serif" font-size="23" fill="#172554">IDS: depth limit</text><rect x="50" y="155" width="415" height="47" rx="8" fill="#ffffff"/><text x="60" y="184" font-family="Arial, sans-serif" font-size="18" fill="#172554">Start limit L = 0</text><text x="245" y="223" font-family="Arial, sans-serif" font-size="22" fill="#172554">↓</text><rect x="50" y="230" width="415" height="47" rx="8" fill="#ffffff"/><text x="60" y="259" font-family="Arial, sans-serif" font-size="18" fill="#172554">Search paths with depth ≤ L</text><text x="245" y="298" font-family="Arial, sans-serif" font-size="22" fill="#172554">↓</text><rect x="50" y="305" width="415" height="47" rx="8" fill="#ffffff"/><text x="60" y="334" font-family="Arial, sans-serif" font-size="18" fill="#172554">Goal found? Return path</text><text x="245" y="373" font-family="Arial, sans-serif" font-size="22" fill="#172554">↓</text><rect x="50" y="380" width="415" height="47" rx="8" fill="#ffffff"/><text x="60" y="409" font-family="Arial, sans-serif" font-size="18" fill="#172554">Otherwise: L = L + 1; repeat</text><rect x="520" y="80" width="445" height="365" rx="8" fill="#ede9fe"/><text x="540" y="117" font-family="Arial, sans-serif" font-size="23" fill="#172554">IDA*: estimated total cost</text><rect x="535" y="155" width="415" height="47" rx="8" fill="#ffffff"/><text x="545" y="184" font-family="Arial, sans-serif" font-size="18" fill="#172554">Start bound B = h(start)</text><text x="730" y="223" font-family="Arial, sans-serif" font-size="22" fill="#172554">↓</text><rect x="535" y="230" width="415" height="47" rx="8" fill="#ffffff"/><text x="545" y="259" font-family="Arial, sans-serif" font-size="18" fill="#172554">Explore while g + h ≤ B</text><text x="730" y="298" font-family="Arial, sans-serif" font-size="22" fill="#172554">↓</text><rect x="535" y="305" width="415" height="47" rx="8" fill="#ffffff"/><text x="545" y="334" font-family="Arial, sans-serif" font-size="18" fill="#172554">Goal found? Return path</text><text x="730" y="373" font-family="Arial, sans-serif" font-size="22" fill="#172554">↓</text><rect x="535" y="380" width="415" height="47" rx="8" fill="#ffffff"/><text x="545" y="409" font-family="Arial, sans-serif" font-size="18" fill="#172554">Otherwise: B = smallest exceeded value</text><text x="35" y="490" font-family="Arial, sans-serif" font-size="21" fill="#172554">Both repeat searches. IDA* uses a lower-bound estimate to prune branches.</text></svg>